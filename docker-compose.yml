services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    command: python -m mws_assistant.api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env_example
    command: python -m pytest -q
    profiles:
      - test
